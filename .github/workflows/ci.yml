name: CI

on:
  pull_request:
  # Runs on main too, so setup-gradle saves its cache there for PRs to read.
  push:
    branches: [main]

# Gradle starts on the runner's JDK and runs the build on the JDK that
# gradle/gradle-daemon-jvm.properties names, downloading it if needed, so no step sets up Java.

# A new push to a PR cancels the run for its previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The default caching is proprietary; this one is MIT-licensed, like the project.
          cache-provider: basic
      # Only CI checks screenshots, because their baselines are recorded on Linux
      # (ARCHITECTURE.md, Tests).
      - run: ./gradlew build -Proborazzi.test.verify=true
      - name: Upload screenshot comparisons
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-comparisons
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore

  instrumented-tests:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The default caching is proprietary; this one is MIT-licensed, like the project.
          cache-provider: basic
      # Lets the emulator use hardware virtualization, as the emulator action's README says to.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Gradle managed devices reject TV images in AGP 9.4.1, so this action starts the emulator.
      # API 36 has the newest Google TV image; there's none for 37 yet (#2).
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google-tv
          arch: x86_64
          profile: tv_1080p
          script: ./gradlew connectedDebugAndroidTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests
          if-no-files-found: ignore
