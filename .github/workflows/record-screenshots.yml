name: Record screenshots

# Records screenshot baselines on Linux, where CI checks them (ARCHITECTURE.md, Tests).
# docs/toolchain.md says how to run it and commit what it records.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Record screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The default caching is proprietary; this one is MIT-licensed, like the project.
          cache-provider: basic
      # Starts empty, so baselines of deleted tests don't come back.
      - run: |
          rm -rf app/src/test/screenshots
          ./gradlew recordRoborazziDebug
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/src/test/screenshots
