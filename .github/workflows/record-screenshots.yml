name: Record screenshots

# Records screenshot baselines on Linux, where CI checks them (ARCHITECTURE.md, Tests).
# docs/toolchain.md says how to run it and commit what it records.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Record screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # Starts empty, so baselines of deleted tests don't come back.
      - run: |
          rm -rf app/src/test/screenshots
          ./gradlew recordRoborazziDebug
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/src/test/screenshots
